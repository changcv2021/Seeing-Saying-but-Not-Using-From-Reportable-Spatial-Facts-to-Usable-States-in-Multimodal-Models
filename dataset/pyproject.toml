[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceconflict"
version = "0.1.0"
description = "Source-anchored spatial contradiction benchmark construction pipeline"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21",
  "pyarrow>=14",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
spaceconflict = "spaceconflict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

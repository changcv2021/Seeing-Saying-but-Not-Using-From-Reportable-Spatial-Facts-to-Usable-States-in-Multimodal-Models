registry_version: "hypo3d_l4_v2"
dataset: hypo3d
transition_mode: question_scoped_local_micrograph
tiers:
  A:
    enabled: true
    operators:
      - operator_id: COUNT_UPDATE_OMISSION
        change_types: [REMOVAL, ADDITION]
        required_facts: [exact_pre_count, exact_change_delta, exact_post_count_oracle]
        changed_slots: [count_value]
      - operator_id: PRE_COUNT_CARRYOVER
        change_types: [REMOVAL, ADDITION, REPLACEMENT]
        required_facts: [exact_pre_count, exact_change_delta, exact_post_count_oracle]
        changed_slots: [count_value]
      - operator_id: REMOVED_OBJECT_PERSISTENCE
        change_types: [REMOVAL]
        required_facts: [target_exists_pre, unique_target, removal_intervention]
        changed_slots: [existence]
      - operator_id: ADDED_OBJECT_ABSENCE
        change_types: [ADDITION]
        required_facts: [new_branch_local_entity, addition_intervention]
        changed_slots: [existence]
      - operator_id: OLD_OBJECT_PERSISTENCE
        change_types: [REPLACEMENT]
        required_facts: [old_target_exists_pre, unique_old_target, replacement_intervention]
        changed_slots: [existence]
      - operator_id: NEW_OBJECT_ABSENCE
        change_types: [REPLACEMENT]
        required_facts: [new_branch_local_entity, replacement_intervention]
        changed_slots: [existence]
      - operator_id: REPLACEMENT_IDENTITY_COLLAPSE
        change_types: [REPLACEMENT]
        required_facts: [unique_old_target, new_branch_local_entity, distinct_identity_rule]
        changed_slots: [identity]
      - operator_id: REPLACEMENT_COUNT_UPDATE_ERROR
        change_types: [REPLACEMENT]
        required_facts: [exact_pre_count, explicit_old_new_classes, exact_post_count_oracle]
        changed_slots: [count_value]
      - operator_id: STALE_SPATIAL_STATE
        change_types: [MOVEMENT]
        required_facts: [unique_target, explicit_pre_relation, mutually_exclusive_post_relation_oracle]
        changed_slots: [relation]
      - operator_id: WRONG_POST_RELATION
        change_types: [MOVEMENT, ADDITION]
        required_facts: [categorical_post_relation_oracle, same_scope, same_reference_frame, exclusive_relation]
        changed_slots: [relation]
  B:
    enabled: false
    operators: [WRONG_TARGET_UPDATE, BRANCH_LEAKAGE, ACTUAL_HYPOTHETICAL_SWAP, ATTRIBUTE_CARRYOVER, IRRELEVANT_CHANGE_ANSWER_DRIFT]
  C:
    enabled: false
    operators: [OVER_UPDATE, UNAFFECTED_RELATION_CHANGE, REACHABILITY_FLIP, ACTION_SUCCESS_FLIP, PRECONDITION_VIOLATION, INTERVENTION_ORDER_SWAP, STEP_OMISSION, COLLISION_CONSEQUENCE]
global_rejection_checks:
  - source_reconstruction_required
  - co_truth_must_be_false
  - single_changed_slot_required
  - no_unprovided_accessible_premise
  - graph_text_graph_required
  - oracle_consistency_verifier_required
  - accessible_evidence_verifier_required


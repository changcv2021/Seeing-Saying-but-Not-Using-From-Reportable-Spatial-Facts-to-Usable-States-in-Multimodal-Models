origins: [SOURCE_NATIVE, BENCHMARK_CONTROLLED]
native_subtypes: [DIRECT, AGGREGATED]
dependency_types: [CORE, CALIBRATION]
unknown_origins: [EVIDENCE_ABLATION, SOURCE_UNDERSPECIFICATION]
allowed_transition_families: [REMOVAL, ADDITION, REPLACEMENT, MOVEMENT, ATTRIBUTE, INVARIANT]
controlled_actions:
  - REMOVE_AND_RECOUNT
  - ADD_AND_RECOUNT
  - REPLACE_AND_RECOUNT
  - REPLACEMENT_IDENTITY
  - MOVE_TO_OPPOSITE_SIDE
  - SWAP_POSITIONS
controlled_truth:
  pre_state_provenance: SOURCE_NATIVE_GT
  intervention_provenance: SPACECONFLICT_CONTROLLED_DSL
  post_state_provenance: DETERMINISTIC_TRANSITION_ENGINE

  require_exact_engine_agreement: true
native_truth:
  pre_state_provenance: SOURCE_NATIVE_GT
  intervention_provenance: HYPO3D_SOURCE_CHANGE
  post_state_provenance: HYPO3D_SOURCE_QA
unknown_reasons:
  - MISSING_PRE_STATE_FACT
  - MISSING_PRE_COUNT
  - AMBIGUOUS_INTERVENTION_TARGET
  - MISSING_TARGET_GROUNDING
  - REFERENCE_FRAME_AMBIGUITY
  - POST_STATE_UNDERSPECIFIED
  - UNRESOLVED_POST_IDENTITY
  - MISSING_INVARIANT_EVIDENCE
  - MULTIPLE_VALID_TRANSITIONS
  - EVIDENCE_ABLATION
quality_gates:
  source_hash: required
  media_resolvable: required
  intervention_visible: required_for_binary
  target_unique: required
  transition_replay: required
  co_truth_possible: false
  requires_unprovided_fact: false
  graph_text_roundtrip: required
  independent_verifier: required
  world_split: required
